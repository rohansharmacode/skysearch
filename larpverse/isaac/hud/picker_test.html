<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picker test · start → topo → pick</title>
<!--
  Test page for picker.js. Serve from the repo root (python3 -m http.server 8799) and open
  /isaac/hud/picker_test.html . Uses picker_test_data/state.json (a real grid seed 7 state.json, trimmed to
  site/heightmap/piles/staging). The "Collapsed tower" card is the same data mirrored, to fake variety.
  Picks are logged to the console and to window.__picks; no API calls are made.
-->
<style>
  :root { --amber:#ffb020; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#06080a; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0;
           display:grid; grid-template-columns:1280px 640px; background:#0c1014; color:#8d98a1; }
  #stage > .fake { display:flex; align-items:center; justify-content:center; font-size:24px; border-left:1px solid #1d2329; }
  #reopen { position:absolute; right:24px; top:24px; font-size:16px; padding:8px 14px; border-radius:8px; background:#151a1f;
            color:#cfd8de; border:1px solid #39424a; cursor:pointer; }
</style>
</head>
<body>
<div id="stage">
  <div class="fake">(Isaac view would be here)</div>
  <div class="fake">(side panel)<button id="reopen">Open site picker</button></div>
</div>
<script src="picker.js"></script>
<script>
const stage = document.getElementById('stage');
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${k})`; }
addEventListener('resize', fit); fit();

// mirror a state.json left-right (x -> -x) to fake a second site
function mirrorX(d) {
  const h = d.heightmap, w = h.w, z = new Array(h.z.length);
  for (let j = 0; j < h.h; j++) for (let i = 0; i < w; i++) z[j * w + i] = h.z[j * w + (w - 1 - i)];
  const fx = p => [-p[0], p[1]];
  return { site: { name: d.site.name + ' (mirrored)' },
    heightmap: { origin: [-(h.origin[0] + (w - 1) * h.res), h.origin[1]], res: h.res, w, h: h.h, z },
    piles: d.piles.map(p => ({ id: p.id, xy: fx(p.xy), polygon: p.polygon.map(fx) })),
    staging: { xy: fx(d.staging.xy), pads: d.staging.pads.map(fx) } };
}

window.__picks = [];
const Q = new URLSearchParams(location.search);
let SITES = [];
function showStart() {
  Picker.start({ stage, sites: SITES, onSite: s => {
    console.log('onSite', s.key);
    // the console would POST ../../api/site {site, seed, look} here (~80 s in Isaac)
    showTopo(s);
  } });
}
function showTopo(s) {
  Picker.topo({ stage, data: s.data, title: s.label, loading: true, density: Q.get('density') || 'auto',
    view: { az: Q.get('az') != null ? +Q.get('az') : undefined, el: Q.get('el') != null ? +Q.get('el') : undefined, fov: +Q.get('fov') || undefined },
    onPick: p => { console.log('onPick', JSON.stringify(p)); window.__picks.push(p); /* console: POST ../../api/goto {pile} */ },
    onBack: () => showStart() });
  setTimeout(() => Picker.setLoading(false), +(new URLSearchParams(location.search).get('ready') || 6000));
}
document.getElementById('reopen').onclick = showStart;

fetch('picker_test_data/state.json').then(r => r.json()).then(d => {
  SITES = [
    { key: 'grid-7-day', label: 'Rubble street', site: 'grid', seed: 7, look: 'day', data: d },
    { key: 'weiguan-7-day', label: 'Collapsed tower', site: 'weiguan', seed: 7, look: 'day', data: mirrorX(d) },
    { key: 'grid-11-dusk', label: 'Street at dusk, dust', site: 'grid', seed: 11, look: 'dusk', data: d },
  ];
  const q = new URLSearchParams(location.search).get('topo');
  q != null ? showTopo(SITES[+q] || SITES[0]) : showStart();
});
</script>
</body>
</html>
