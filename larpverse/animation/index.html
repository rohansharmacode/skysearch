<style>
/* Layout: full-bleed 3D field-ops viewer; HUD floats in four corners, timeline docked at the bottom. Single dark theme by design. */
:root {
  color-scheme: dark;
  --ink: #0b1117;
  --panel: rgba(11, 17, 23, 0.82);
  --line: rgba(150, 180, 200, 0.18);
  --fg: #e4ebf0;
  --muted: #8b9dab;
  --lidar: #9b6bff;
  --radar: #ff9f43;
  --acoustic: #22c3d6;
  --cone: #ffe14a;
  --detect: #ff4545;
  --coord: #6fd36f;
  --drone: #e4ebf0;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-display); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#app > canvas { display: block; position: absolute; inset: 0; }
.labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.hud { position: absolute; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }

.lbl { font: 500 11px/1.2 var(--f-mono); color: var(--fg); background: rgba(8, 12, 16, 0.78); border: 1px solid var(--line); padding: 3px 6px; border-radius: 3px; white-space: nowrap; transform: translateY(-14px); }
.lbl.lidar { border-color: var(--lidar); }
.lbl.radar { border-color: var(--radar); color: #ffd3a6; }
.lbl.acoustic { border-color: var(--cone); color: #fff2a8; }
.lbl.detect { border-color: var(--detect); color: #ffd0d0; background: rgba(60, 8, 8, 0.85); }
.lbl.coord { border-color: var(--coord); color: #c9f5c9; }
.lbl.truth { border-style: dashed; color: var(--muted); }
.lbl.drone b { color: var(--drone); font-weight: 500; }

#top { top: 16px; left: 16px; max-width: min(460px, calc(100% - 32px)); }
.brand { font: 500 11px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--detect); box-shadow: 0 0 10px var(--detect); }
#phaseNo { font: 500 12px/1 var(--f-mono); color: var(--coord); margin-top: 14px; letter-spacing: 0.08em; }
#phaseTitle { font-size: clamp(26px, 4vw, 40px); font-weight: 600; line-height: 1.02; margin: 6px 0 10px; text-wrap: balance; letter-spacing: -0.01em; }
#caption { font-size: 15px; line-height: 1.45; color: #c8d3db; background: var(--panel); border-left: 2px solid var(--coord); padding: 10px 12px; max-width: 62ch; backdrop-filter: blur(4px); }

#layers { top: 16px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.tog { font: 500 12px/1 var(--f-mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 7px 10px; border-radius: 3px; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
.tog i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
.tog[aria-pressed="false"] { color: var(--muted); }
.tog[aria-pressed="false"] i { background: transparent; box-shadow: none; outline: 1px solid var(--c); }
.tog:focus-visible, .btn:focus-visible, .chap:focus-visible { outline: 2px solid var(--coord); outline-offset: 2px; }
#follow { color: var(--coord); border-color: var(--coord); }

#side { right: 16px; bottom: 96px; width: 330px; display: flex; flex-direction: column; gap: 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; backdrop-filter: blur(4px); }
.panel h3 { margin: 0 0 8px; font: 500 10px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
#radarPanel canvas { width: 100%; height: 132px; display: block; }
#log { font: 400 11.5px/1.45 var(--f-mono); color: #b9c6cf; max-height: 168px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; scrollbar-width: thin; }
#log div { display: grid; grid-template-columns: 38px 1fr; gap: 6px; }
#log span { color: var(--muted); font-variant-numeric: tabular-nums; }
#log .new { color: var(--fg); }
#log .k-coord b { color: var(--coord); font-weight: 500; }

#bar { left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.btn { font: 500 12px/1 var(--f-mono); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 3px; height: 30px; min-width: 34px; padding: 0 9px; cursor: pointer; }
.btn:hover, .tog:hover { border-color: var(--muted); }
#time { font: 400 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; }
#chapters { flex: 1; display: flex; gap: 3px; min-width: 0; }
.chap { position: relative; height: 30px; background: rgba(150, 180, 200, 0.08); border: 0; border-radius: 2px; cursor: pointer; padding: 0 6px; overflow: hidden; text-align: left; color: var(--muted); font: 500 10.5px/30px var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.chap .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(111, 211, 111, 0.22); border-right: 2px solid var(--coord); pointer-events: none; }
.chap span { position: relative; }
.chap.on { color: var(--fg); }
.chap.done .fill { border-right: 0; }

#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); font: 500 13px var(--f-mono); color: var(--muted); letter-spacing: 0.08em; z-index: 5; }

@media (max-height: 760px) { #log { max-height: 84px; } #radarPanel canvas { height: 100px; } #caption { font-size: 13.5px; } }
@media (max-width: 860px) {
  #side { display: none; }
  #caption { font-size: 13.5px; }
  #layers { top: auto; bottom: 70px; right: 16px; left: 16px; flex-direction: row; flex-wrap: wrap; }
  .tog { padding: 6px 8px; font-size: 11px; }
  .chap span { display: none; }
  #time { min-width: 0; }
}
</style>

</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- constants & helpers ----------
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const T_END = 66;
const LAYER_Y = 5.6;                     // height of the 2D search layer drawing
const C = { lidar: 0x9b6bff, radar: 0xff9f43, acoustic: 0x22c3d6, cone: 0xffe14a, detect: 0xff4545, coord: 0x6fd36f, drone: 0xdfe6ec, good: 0x4fd18b, bad: 0xff6464 };
const CHAPTERS = [
  { name: 'Deploy', t0: 0, t1: 7 },
  { name: 'LiDAR survey', t0: 7, t1: 17 },
  { name: 'Find flat ground & land', t0: 17, t1: 24 },
  { name: 'Radar scan', t0: 24, t1: 33 },
  { name: 'Ambiguity → relocate', t0: 33, t1: 41 },
  { name: 'Rescan', t0: 41, t1: 47 },
  { name: 'Acoustic', t0: 47, t1: 55 },
  { name: 'Site model & dashboard', t0: 55, t1: 66 },
];
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(11);
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const polar = (deg, r) => ({ x: r * Math.cos(deg * D2R), z: r * Math.sin(deg * D2R) });
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const site = p => [+(p.x).toFixed(1), +(-p.z).toFixed(1)];          // three (x,z) -> site frame (east, north)
const bearingDeg = (from, to) => ((Math.atan2(-(to.z - from.z), to.x - from.x) / D2R) + 360) % 360; // CCW from east
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf); const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

// Rubble mound heightfield (metres). Ground ~0, pile ~4 m.
function H(x, z) {
  const m = 3.3 * Math.exp(-((x / 7) ** 2 + (z / 6) ** 2) * 1.4) + 0.9 * Math.exp(-((x - 2.4) ** 2 + (z - 1.6) ** 2) / 5);
  const f = clamp(m / 0.9, 0, 1);
  return m + f * ((vnoise(x * 0.9, z * 0.9) - 0.5) * 0.55 + (vnoise(x * 3.1, z * 3.1) - 0.5) * 0.16) + (vnoise(x * 0.35, z * 0.35) - 0.5) * 0.05;
}

// Hidden ground truth. Only the "observation generator" below reads this.
const TRUTH = { T: { x: 1.0, z: 2.6, depth: 1.6 }, S2: { x: -4.6, z: -3.2, depth: 0.9 } };
const SITE_ANG = { A: 200, B: 10, C: 100 };
const CSLAB = polar(SITE_ANG.C, 8.6);
const BASE = { x: -30, z: 22 };

// ---------- renderer / scene ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.prepend(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.domElement.className = 'labels'; app.insertBefore(labelR.domElement, document.getElementById('top'));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e151c);
scene.fog = new THREE.Fog(0x0e151c, 70, 150);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 4; controls.maxDistance = 120;

scene.add(new THREE.HemisphereLight(0xa9bccc, 0x3a3128, 0.85));
const sun = new THREE.DirectionalLight(0xffd9b0, 1.9);
sun.position.set(-28, 42, 18); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 });
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6f8fb0, 0.5); rim.position.set(30, 20, -30); scene.add(rim);

const allLabels = [];
function label(text, cls, obj, offset = [0, 0, 0]) {
  const el = document.createElement('div'); el.className = 'lbl ' + (cls || ''); el.innerHTML = text;
  const o = new CSS2DObject(el); o.position.set(...offset); obj.add(o); allLabels.push(o); return o;
}

// ---------- ground & rubble ----------
const groundGeo = new THREE.PlaneGeometry(80, 80, 200, 200); groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = H(x, z); p.setY(i, y);
    const n = vnoise(x * 1.7, z * 1.7) * 0.08, k = 0.36 + n - y * 0.02;
    col[i * 3] = k * 1.08; col[i * 3 + 1] = k; col[i * 3 + 2] = k * 0.9;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(col, 3)); groundGeo.computeVertexNormals();
}
const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat); ground.receiveShadow = true; scene.add(ground);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5a544c, roughness: 1 }));
outer.position.y = -0.09; outer.receiveShadow = true; scene.add(outer);

const rubble = [], rubbleMats = [];
const mat = c => { const m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.93, metalness: 0.02, flatShading: true }); rubbleMats.push(m); return m; };
const concrete = ['#8f8b84', '#7c7973', '#9d978d', '#6d6963', '#a59c8f'].map(mat);
const brick = ['#86614d', '#7a4f3f'].map(mat);
function addRubble(mesh) { mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); mesh.updateMatrixWorld(); rubble.push(mesh); return mesh; }

for (let i = 0; i < 115; i++) {
  const r = 8.4 * Math.pow(rnd(), 0.7), a = rnd() * TAU, x = r * Math.cos(a), z = r * Math.sin(a);
  if (Math.hypot(x - CSLAB.x, z - CSLAB.z) < 2.7) continue;
  const m = new THREE.Mesh(new THREE.BoxGeometry(R(1.2, 3.8), R(0.14, 0.32), R(0.8, 2.6)), rnd() < 0.85 ? concrete[i % 5] : brick[i % 2]);
  m.position.set(x, H(x, z) + R(-0.15, 0.22), z); m.rotation.set(R(-0.55, 0.55), rnd() * TAU, R(-0.55, 0.55));
  addRubble(m);
}
for (let i = 0; i < 90; i++) {
  const r = 10.6 * Math.pow(rnd(), 0.6), a = rnd() * TAU, x = r * Math.cos(a), z = r * Math.sin(a);
  if (Math.hypot(x - CSLAB.x, z - CSLAB.z) < 2.2) continue;
  const s = R(0.18, 0.7), m = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rnd() < 0.7 ? concrete[i % 5] : brick[i % 2]);
  m.scale.set(1, R(0.45, 1), R(0.6, 1.3)); m.position.set(x, H(x, z) + s * 0.25, z); m.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
  addRubble(m);
}
for (let i = 0; i < 6; i++) {
  const a = rnd() * TAU, r = R(1, 6), x = r * Math.cos(a), z = r * Math.sin(a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, R(2.5, 4.5), 8), concrete[i % 5]);
  m.position.set(x, H(x, z) + 0.2, z); m.rotation.set(0, rnd() * TAU, Math.PI / 2 + R(-0.35, 0.35)); addRubble(m);
}
{ // broken wall fragment, the one bit of building still standing
  const c = polar(152, 7.6), yaw = -152 * D2R + Math.PI / 2;
  const dir = { x: Math.cos(152 * D2R + Math.PI / 2), z: Math.sin(152 * D2R + Math.PI / 2) };
  const hs = [3.9, 4.3, 2.2, 0, 3.4, 2.6, 1.4];
  hs.forEach((h, k) => {
    if (!h) return; const o = (k - 3) * 0.86, x = c.x + dir.x * o, z = c.z + dir.z * o;
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.86, h, 0.32), brick[k % 2]);
    m.position.set(x, H(x, z) - 0.25 + h / 2, z); m.rotation.y = yaw + R(-0.04, 0.04); addRubble(m);
  });
}
// The big flat slab d3 lands on. Geometrically flat, structurally not: it rocks under the drone.
let maxUnder = 0; for (let dx = -1.8; dx <= 1.8; dx += 0.3) for (let dz = -1.8; dz <= 1.8; dz += 0.3) maxUnder = Math.max(maxUnder, H(CSLAB.x + dx, CSLAB.z + dz));
const slabC = addRubble(new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.34, 3.4), concrete[2]));
slabC.position.set(CSLAB.x, maxUnder + 0.3, CSLAB.z); slabC.rotation.y = 0.3; slabC.updateMatrixWorld();
const SLAB_TOP = slabC.position.y + 0.17;
{ // rebar
  const pts = [];
  for (let i = 0; i < 70; i++) { const s = rubble[(i * 7) % 115]; if (!s) continue; const p = s.position; const a = rnd() * TAU, e = R(0.3, 1.2), L = R(0.6, 1.6); pts.push(p.x, p.y, p.z, p.x + Math.cos(a) * L * Math.cos(e), p.y + Math.sin(e) * L, p.z + Math.sin(a) * L * Math.cos(e)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x5b3b2b })));
}
const rubbleSpheres = rubble.map(m => { m.geometry.computeBoundingSphere(); const s = m.geometry.boundingSphere.clone().applyMatrix4(m.matrixWorld); return { m, x: s.center.x, y: s.center.y, z: s.center.z, r: s.radius }; });

// Staging area + coordinator
const baseG = new THREE.Group(); baseG.position.set(BASE.x, 0, BASE.z); scene.add(baseG);
{
  const pad = new THREE.Mesh(new THREE.BoxGeometry(9, 0.12, 4), new THREE.MeshStandardMaterial({ color: 0x2b333b, roughness: 0.8 })); pad.position.y = 0.06; pad.receiveShadow = true; baseG.add(pad);
  const truck = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.2, 2.2), new THREE.MeshStandardMaterial({ color: 0xd9dde0, roughness: 0.6 })); truck.position.set(0, 1.1, -3.6); truck.castShadow = true; baseG.add(truck);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.2), new THREE.MeshStandardMaterial({ color: 0x9aa4ad })); mast.position.set(1.6, 3.8, -3.6); baseG.add(mast);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.16), new THREE.MeshBasicMaterial({ color: C.coord })); tip.position.set(1.6, 5.4, -3.6); baseG.add(tip);
  label('Coordinator · staging', 'coord', baseG, [1.6, 6.1, -3.6]);
}
const COORD_POS = new THREE.Vector3(BASE.x + 1.6, 5.4, BASE.z - 3.6);

// ---------- ray casting (LiDAR) ----------
const _rc = new THREE.Raycaster(), _hits = [];
function castRay(o, d, far) {
  let best = far;
  // heightfield: sphere-trace then bisect
  let s = 0;
  for (let it = 0; it < 200 && s < best; it++) {
    const y = o.y + d.y * s, h = H(o.x + d.x * s, o.z + d.z * s), gap = y - h;
    if (gap < 0.01) { let lo = Math.max(0, s - 0.6), hi = s; for (let k = 0; k < 7; k++) { const mid = (lo + hi) / 2; if (o.y + d.y * mid - H(o.x + d.x * mid, o.z + d.z * mid) > 0) lo = mid; else hi = mid; } best = hi; break; }
    s += Math.max(0.12, gap * 0.45);
  }
  _rc.ray.origin.set(o.x, o.y, o.z); _rc.ray.direction.set(d.x, d.y, d.z); _rc.far = best;
  for (const sp of rubbleSpheres) {
    const ox = sp.x - o.x, oy = sp.y - o.y, oz = sp.z - o.z, tca = ox * d.x + oy * d.y + oz * d.z;
    if (tca < -sp.r || tca - sp.r > best) continue;
    if (ox * ox + oy * oy + oz * oz - tca * tca > sp.r * sp.r) continue;
    _hits.length = 0; sp.m.raycast(_rc, _hits);
    for (const h of _hits) if (h.distance < best) best = h.distance;
  }
  return best;
}

  siteMk.C.ring.material.color.setHex(t >= 35 ? C.bad : C.good);
  siteMk.C.l.element.innerHTML = t >= 35 ? `${SITES.C.id} · unstable` : `${SITES.C.id} · slab, ${SITES.C.slope.toFixed(1)}°`;
  candMk.forEach((m, i) => { m.g.visible = t >= 33.2 + i * 0.25 && t < (i === 0 ? 55 : 36); if (i === 0) m.l.element.innerHTML = t >= 41 ? `${SITES.D.id} · d3` : `${SITES.D.id} · Δr ${cands[0].sep.toFixed(1)} m · ${cands[0].score.toFixed(2)}`; });
  relPath.visible = t >= 34.5 && t < 41.5;

  // search layer
  layer.visible = t >= 25;
  const stage = scans.filter(s => s.t + 0.6 <= t).length;
  beliefPlane.visible = ui.radar && stage > 0; if (stage > 0) { beliefPlane.material.map = beliefTex[stage]; beliefPlane.material.needsUpdate = beliefPlane.material._st !== stage; beliefPlane.material._st = stage; }
  beliefPlane.material.opacity = t < 47 ? 0.95 : lerp(0.95, 0.35, sstep(47, 48, t));
  rings.forEach(r => { const u = sstep(r.s.t, r.s.t + 0.6, t), fade = 1 - sstep(47, 48, t); r.g.visible = ui.radar && u > 0 && fade > 0; r.g.scale.setScalar(Math.max(0.001, u * r.s.r)); r.lbl.visible = r.g.visible && u >= 1 && t < 47; });
  modeMk.forEach(m => m.g.visible = ui.radar && t >= 30.5 && t < 43.5);
  est.visible = ui.radar && t >= 44.5; estLbl.visible = est.visible && t < 55 || t >= 61;
  const pf = (t * 0.8) % 1; pingRing.scale.setScalar(0.4 + pf * 1.6); pingRing.material.opacity = 1 - pf;
  const hideM = clamp(1 - sstep(55, 55.8, t) + sstep(60.5, 61.5, t), 0, 1);
  cones.forEach(c => { const u = sstep(c.o.t, c.o.t + 0.8, t) * hideM; c.g.visible = ui.acoustic && u > 0; c.fill.material.opacity = 0.14 * u; });
  acPt.visible = ui.acoustic && t >= 52 && hideM > 0.5; acLbl.visible = acPt.visible;
  sounds.forEach((s, j) => { const on = ui.acoustic && t >= 47.2 && t < 55; s.visible = on; if (!on) return; const f = ((t - 47.2) / 1.1 + j / 3) % 1; s.position.copy(S2_SURF); s.scale.setScalar(0.3 + f * 9); s.material.opacity = 0.35 * (1 - f); });

  // site model phase
  const fadeR = sstep(55, 58, t); setOpacity(rubbleMats, 1 - 0.93 * fadeR); setOpacity([groundMat], 1 - 0.3 * fadeR);
  depthG.visible = ui.radar && t >= 56.5; depthLbl.visible = depthG.visible && t >= 57.5 && t < 62;
  const hp = (t * 0.9) % 1; ping3Halo.scale.setScalar(1 + hp * 2.4); ping3Halo.material.opacity = 0.5 * (1 - hp);
  digRing.material.opacity = 0.9;

  // survivors
  const br = 1 + 0.07 * Math.sin(TAU * 0.27 * t * 3);
  surv1.torso.scale.set(br, 1, br);
  surv1.g.visible = surv2.g.visible = ui.truth && t >= 3;
  t1Lbl.visible = surv1.g.visible && t >= 24 && t < 47; t2Lbl.visible = surv2.g.visible && t >= 47 && t < 55;
  ghostMat.opacity = 0.32 + 0.12 * Math.sin(t * 2);

  if (follow) { camAt(t); camera.position.copy(_cp); controls.target.copy(_ct); }
}

// ---------- loop ----------
function resize() { const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h); labelR.setSize(w, h); camera.aspect = w / h; camera.fov = w < 700 ? 60 : 45; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now; // rAF timestamps can predate setup: never let time run backwards
  if (playing) { T += dt * speed; if (T >= T_END) { T = T_END; setPlay(false); } }
  update(T); controls.update(); renderer.render(scene, camera);
  for (const o of allLabels) { let v = true; for (let p = o.parent; p; p = p.parent) if (!p.visible) { v = false; break; } o.element.style.visibility = v ? '' : 'hidden'; }
  labelR.render(scene, camera);
  requestAnimationFrame(frame);
}
setPlay(playing);
window.seek = v => { T = v; setPlay(false); };
document.getElementById('loading').remove();
requestAnimationFrame(frame);
</script>
