<title>Larpverse Live View</title>
<style>
/* Live 3D view of the running CPU mission (fallback for the Isaac take). Polls the run's output dir:
   state.json + motion.json + live.json + hud.json (+ pointcloud.bin). ?data=<dir> (default ../dashboard/data/).
   Same colour system as the dashboard / animation / Isaac overlay: red ping, yellow human-audio cone, teal acoustic
   lead, amber radar, green coordinator, purple LiDAR, blue comms. Single dark theme by design. */
:root {
  color-scheme: dark;
  --ink: #0b1117; --panel: rgba(11, 17, 23, 0.86); --line: rgba(150, 180, 200, 0.18); --fg: #e4ebf0; --muted: #8b9dab;
  --detect: #ff4545; --coord: #6fd36f; --acoustic: #22c3d6; --cone: #ffe14a; --radar: #ff9f43; --wifi: #3b82f6;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--fg); font-family: var(--f-display); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; }
#app > canvas { position: absolute; inset: 0; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { font: 500 12px/1.25 var(--f-mono); color: var(--fg); background: rgba(8, 12, 16, 0.78); border: 1px solid var(--line); padding: 3px 6px; border-radius: 3px; white-space: nowrap; transform: translateY(-14px); }
.lbl.pile { font-size: 13px; background: rgba(8, 12, 16, 0.55); }
.lbl.detect { border-color: var(--detect); color: #ffd0d0; background: rgba(60, 8, 8, 0.85); }
.lbl.detect small { display: block; color: #f3c2c2; font-size: 10.5px; }
.lbl.event { border-color: var(--cone); color: #fff3b0; }
.lbl.drone b { color: #f4f8fb; }
.hud { position: absolute; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85); }
#top { left: 16px; top: 14px; max-width: min(560px, calc(100% - 32px)); }
.brand { font: 500 11px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--detect); box-shadow: 0 0 10px var(--detect); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
#clock { font: 500 15px/1.3 var(--f-mono); margin-top: 8px; }
#badge { display: inline-block; margin-top: 6px; font: 500 11.5px/1 var(--f-mono); color: var(--coord); border: 1px solid rgba(111, 211, 111, 0.6); background: var(--panel); padding: 5px 8px; border-radius: 3px; text-shadow: none; }
#banner { left: 50%; top: 18px; transform: translateX(-50%); font: 600 clamp(18px, 2.4vw, 28px)/1.15 var(--f-display); color: #1a1205; background: #ffb347; border-radius: 4px; padding: 10px 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); text-shadow: none; max-width: calc(100% - 40px); text-align: center; }
#event { left: 16px; bottom: 16px; max-width: min(760px, calc(100% - 32px)); font: 500 13px/1.4 var(--f-mono); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cone); padding: 8px 10px; border-radius: 3px; text-shadow: none; }
#event.causal { border-left-color: var(--coord); }
#legend { right: 16px; bottom: 16px; font: 500 11px/1.6 var(--f-mono); background: var(--panel); border: 1px solid var(--line); padding: 6px 9px; border-radius: 3px; text-shadow: none; color: var(--muted); }
#legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 5px 0 8px; vertical-align: -1px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; font: 500 14px var(--f-mono); color: var(--muted); background: var(--ink); text-align: center; padding: 24px; white-space: pre-wrap; }
[hidden] { display: none !important; }
@media (max-width: 700px) { #legend { display: none; } #clock { font-size: 12.5px; } }

<script type="module">

// ---------------- scene ----------------
const app = $('app');

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e151c); scene.fog = new THREE.Fog(0x0e151c, 110, 260);
const camera = new THREE.PerspectiveCamera(45, 1, 0.2, 600);
scene.add(new THREE.HemisphereLight(0xa9bccc, 0x3a3128, 0.95));
const sun = new THREE.DirectionalLight(0xffd9b0, 1.9); sun.position.set(-40, 60, 25); scene.add(sun);

// ---------------- motion.json sampler (port of sim/flight_motion.py: Profile1D, Brake, Trajectory.nominal, Winch) ----------------

function mkProf(segs) {

function loadMotion(m) {

function pieceAt(tl, t) { let k = 0; for (let i = 0; i < tl.pieces.length; i++) if (tl.pieces[i].t0 <= t) k = i; return tl.pieces[k]; }

// ---------------- heavy coaxial X8 drone (as animation/grid-search.html) ----------------
const LEGH = 0.8, ARM = 1.1, PROP_R = 0.69;

  const dark = M(0x2a2e35), carbon = M(0x101214, { roughness: 0.35 }), metal = M(0x9ea2a8, { metalness: 0.8, roughness: 0.3 });
  const add = (geo, mat, x, y, z, par = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); par.add(m); return m; };
  add(new THREE.BoxGeometry(1.05, 0.36, 0.66), dark, 0, 0, 0);

    add(new THREE.BoxGeometry(ARM, 0.07, 0.09), carbon, cx / 2, 0.06, cz / 2).rotation.y = -a;
    add(new THREE.CylinderGeometry(0.09, 0.09, 0.42, 12), metal, cx, 0.14, cz);
    for (const y of [-0.02, 0.33]) {

      const blades = new THREE.Mesh(new THREE.BoxGeometry(PROP_R * 2, 0.012, 0.09), carbon); r.add(blades);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(PROP_R, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x1a1d21, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));

  add(new THREE.CylinderGeometry(0.1, 0.1, 0.14, 18), lidarMat, 0.6, 0.02, 0).rotation.z = 0.75;
  const micMat = M(0x0c3f46, { emissive: C.acoustic, emissiveIntensity: 0.3 });

  for (const s of [1, -1]) {
    add(new THREE.CylinderGeometry(0.025, 0.025, 1.3), M(0x3b3f45), 0, -LEGH + 0.03, s * 0.42).rotation.z = Math.PI / 2;
    for (const x of [0.32, -0.32]) add(new THREE.CylinderGeometry(0.022, 0.022, LEGH - 0.18), M(0x3b3f45), x, -LEGH / 2 + 0.05, s * 0.36);
  }
  const pod = new THREE.Group(); scene.add(pod);
  const radarMat = M(0x3a2207, { emissive: C.radar, emissiveIntensity: 0.4 });
  add(new THREE.BoxGeometry(0.5, 0.3, 0.42), M(0xd47a1c, { roughness: 0.6 }), 0, 0.15, 0, pod);
  add(new THREE.BoxGeometry(0.44, 0.02, 0.36), radarMat, 0, 0.0, 0, pod);

  const wave = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 8, 0, TAU, Math.PI - 0.7, 0.7), new THREE.MeshBasicMaterial({ color: C.radar, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })); scene.add(wave);
  const hot = new THREE.Group(); scene.add(hot);

  hot.add(new THREE.Mesh(new THREE.RingGeometry(0.985, 1, 128).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: C.wifi, transparent: true, opacity: 0.4, depthWrite: false })));

}
const drones = {};
const droneOf = id => drones[id] || (drones[id] = makeDrone(id));

// ---------------- data ----------------
let S = null, MOT = null, LIVE = null, HUD = null, motionKey = '', hmKey = '', pcKey = '';
const clock = { t: 0, wall: 0, rate: 0, shown: 0, seen: false };
async function getJSON(name) { const r = await fetch(DATA + name + '?_=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(name + ' ' + r.status); return r.json(); }
async function poll() {

    const s = await getJSON('state.json');
    const now = performance.now() / 1000;
    if (clock.seen && s.t !== S.t) { const r = (s.t - clock.t) / Math.max(0.05, now - clock.wall); if (r >= 0 && r < 60) clock.rate = clock.rate ? clock.rate * 0.6 + r * 0.4 : r; }
    if (!clock.seen || s.t !== clock.t) { clock.t = s.t; clock.wall = now; }
    if (s.phase === 'done') clock.rate = 0;
    if (!clock.seen) clock.shown = s.t;
    clock.seen = true; S = s; onState();
  } catch (e) { /* run not started yet, or a file being replaced: keep the last frame */ }

  try { HUD = await getJSON('hud.json'); } catch (e) { }
}
async function pollMotion() {
  try { const r = await fetch(DATA + 'motion.json?_=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return; const txt = await r.text(); const key = txt.length + ':' + txt.slice(-64); if (key !== motionKey) { MOT = loadMotion(JSON.parse(txt)); motionKey = key; } } catch (e) { }
}
setInterval(poll, POLL_MS); setInterval(pollMotion, 2000); poll(); pollMotion();

// ---------------- static-ish layers built from state ----------------
let terrain = null, hmAt = () => 0;
function buildTerrain(hm) {
  const { w, h, res, z } = hm, [x0, y0] = hm.origin;
  hmAt = (x, y) => { const i = clamp(Math.round((x - x0) / res), 0, w - 1), j = clamp(Math.round((y - y0) / res), 0, h - 1); return z[j * w + i] || 0; };
  const pos = new Float32Array(w * h * 3), col = new Float32Array(w * h * 3), idx = [];

    const n = (Math.sin(x * 1.7) * Math.cos(y * 1.3) + 1) * 0.03, c = 0.36 + n + Math.min(zz, 4) * 0.035; col.set([c * 1.08, c, c * 0.9], k * 3);

  const outer = new THREE.Mesh(new THREE.PlaneGeometry(800, 800).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5a544c, roughness: 1 })); outer.position.y = -0.3; scene.add(outer);
}
// seed-7 grid site: draw the scenario's rubble boxes too (same pieces as Isaac and the concept animation)
function loadRubble() {

    const geos = { concrete: [], brick: [] }, q = new THREE.Quaternion(), m4 = new THREE.Matrix4();
    for (const p of sc.piles) for (const pc of p.pieces) { const g = new THREE.BoxGeometry(...pc.s); m4.compose(V(...pc.c), q.set(...pc.q), V(1, 1, 1)); g.applyMatrix4(m4); (geos[pc.m === 'brick' ? 'brick' : 'concrete']).push(g); }
    for (const k of Object.keys(geos)) {   // one draw call per material: concatenate the non-indexed boxes
      const parts = geos[k].map(g => g.toNonIndexed()), n = parts.reduce((a, g) => a + g.attributes.position.count, 0);
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let o = 0;

      const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); mg.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
