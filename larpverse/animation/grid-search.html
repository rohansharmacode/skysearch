<style>
/* Layout: full-bleed 3D field view. Caption top-left, layer toggles top-right, operator dashboard bottom-left,
   acoustic agent rail on the right, operator tablet overlays the centre, chapter timeline docked at the bottom.
   Single dark theme by design. */
:root {
  color-scheme: dark;
  --ink: #0b1117;
  --panel: rgba(11, 17, 23, 0.86);
  --line: rgba(150, 180, 200, 0.18);
  --fg: #e4ebf0;
  --muted: #8b9dab;
  --lidar: #9b6bff;
  --radar: #ff9f43;
  --acoustic: #22c3d6;
  --cone: #ffe14a;
  --detect: #ff4545;
  --coord: #6fd36f;
  --op: #5aa9ff;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-display); overflow: hidden; margin: 0; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#app > canvas { display: block; position: absolute; inset: 0; }
.labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.hud { position: absolute; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }

.lbl { font: 500 11px/1.2 var(--f-mono); color: var(--fg); background: rgba(8, 12, 16, 0.78); border: 1px solid var(--line); padding: 3px 6px; border-radius: 3px; white-space: nowrap; transform: translateY(-14px); }
.lbl.pile { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; background: rgba(8, 12, 16, 0.55); }
.lbl.radar { border-color: var(--radar); color: #ffd3a6; }
.lbl.detect { border-color: var(--detect); color: #ffd0d0; background: rgba(60, 8, 8, 0.85); }
.lbl.coord { border-color: var(--coord); color: #c9f5c9; }
.lbl.teal { border-color: var(--acoustic); color: #c4f3f8; }
.lbl.op { border-color: var(--op); color: #d2e7ff; }
.lbl.truth { border-style: dashed; color: var(--muted); }
.lbl.ping { margin-top: -26px; margin-left: 70px; }
.lbl.drone b { color: #ef5350; font-weight: 500; }

#top { top: 16px; left: 16px; max-width: min(440px, calc(100% - 32px)); }
.brand { font: 500 11px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--detect); box-shadow: 0 0 10px var(--detect); }
#phaseNo { font: 500 12px/1 var(--f-mono); color: var(--coord); margin-top: 12px; letter-spacing: 0.08em; }
#phaseTitle { font-size: clamp(24px, 3.6vw, 38px); font-weight: 600; line-height: 1.02; margin: 6px 0 10px; text-wrap: balance; }
#caption { font-size: 15px; line-height: 1.45; color: #c8d3db; background: var(--panel); border-left: 2px solid var(--coord); padding: 10px 12px; }

#layers { z-index: 4; top: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 380px; }
.tog { font: 500 11.5px/1 var(--f-mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 7px 9px; border-radius: 3px; display: flex; align-items: center; gap: 7px; cursor: pointer; }
.tog i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
.tog[aria-pressed="false"] { color: var(--muted); }
.tog[aria-pressed="false"] i { background: transparent; box-shadow: none; outline: 1px solid var(--c); }
.tog:hover, .btn:hover { border-color: var(--muted); }
.tog:focus-visible, .btn:focus-visible, .chap:focus-visible { outline: 2px solid var(--coord); outline-offset: 2px; }
#follow { color: var(--coord); border-color: var(--coord); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; backdrop-filter: blur(4px); }
.panel h3 { margin: 0 0 8px; font: 500 10px/1.2 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

#dash { left: 16px; bottom: 74px; }
#dash canvas { display: block; width: 236px; height: 288px; }
#dash h3 b { color: var(--detect); font-weight: 500; }

#agent { right: 16px; top: 104px; bottom: 74px; width: 340px; display: flex; flex-direction: column; }
#agent .panel { display: flex; flex-direction: column; gap: 8px; min-height: 0; max-height: 100%; overflow: hidden; }
.illus { color: var(--cone); letter-spacing: 0.06em; }
.pipe { display: flex; flex-wrap: wrap; gap: 4px; font: 500 10.5px/1 var(--f-mono); color: var(--muted); }
.pipe span { border: 1px solid var(--line); padding: 4px 5px; border-radius: 2px; }
.pipe span.on { border-color: var(--acoustic); color: #c4f3f8; }
#clips, #queue { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: none; }
.clip { border: 1px solid var(--line); border-left: 3px solid var(--acoustic); border-radius: 3px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; background: rgba(34, 195, 214, 0.04); }
.clip.nonhuman { border-left-color: var(--muted); }
.clip .hd { display: flex; justify-content: space-between; font: 500 11px var(--f-mono); }
.clip .hd b { font-weight: 500; color: var(--fg); }
.clip .cls { color: var(--acoustic); }
.clip.nonhuman .cls { color: var(--muted); }
.clip q { font: italic 400 14px/1.3 var(--f-display); color: #e9f3f5; quotes: "“" "”"; min-height: 1.3em; }
.wave { display: flex; align-items: center; gap: 1px; height: 18px; }
.wave i { width: 3px; background: var(--acoustic); opacity: 0.75; border-radius: 1px; }
.clip.nonhuman .wave i { background: var(--muted); }
.scores { display: grid; grid-template-columns: repeat(3, 1fr) 46px; gap: 6px; font: 10px var(--f-mono); color: var(--muted); align-items: end; }
.bar { height: 4px; background: rgba(150, 180, 200, 0.15); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--acoustic); width: 0; transition: width 0.4s; }
.scores .pr { font: 600 18px/1 var(--f-mono); color: var(--fg); text-align: right; }
.row { display: grid; grid-template-columns: 30px 1fr 40px; gap: 8px; align-items: center; font: 12px var(--f-mono); padding: 5px 4px; border-bottom: 1px dashed var(--line); }
.row b { font-weight: 500; font-size: 13px; }
.row .why { color: var(--muted); font-size: 11px; line-height: 1.3; }
.row .s { text-align: right; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.row.top { background: rgba(34, 195, 214, 0.12); border-radius: 3px; }
.row.top .s { color: var(--acoustic); }
.row.done .s { color: var(--detect); font-size: 11px; }
#dispatch { font: 500 12px var(--f-mono); color: var(--coord); border: 1px dashed rgba(111, 211, 111, 0.6); padding: 7px 9px; border-radius: 3px; }

#tablet { position: absolute; z-index: 3; left: 50%; top: 50%; width: min(560px, 62vw); transform: translate(-50%, -46%); background: transparent; border: 10px solid #1d252d; border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; overflow: hidden; pointer-events: none; }
#tablet .th { display: flex; justify-content: space-between; padding: 8px 12px; font: 500 11px var(--f-mono); color: var(--muted); border-bottom: 1px solid var(--line); background: #0b1117; }
#tablet .th b { color: var(--detect); font-weight: 500; }
#tabScreen { position: relative; aspect-ratio: 16 / 10; max-width: 100%; }
#tabMap { position: absolute; inset: 0; width: 100%; height: 100%; background: #0b1117; }
#tabGL { position: absolute; inset: 0; }
#tabPing { position: absolute; font: 500 11px/1.3 var(--f-mono); background: rgba(60, 8, 8, 0.88); border: 1px solid var(--detect); color: #ffd6d6; padding: 3px 6px; border-radius: 3px; white-space: nowrap; transform: translate(12px, -50%); }
#tabYou { position: absolute; font: 500 11px var(--f-mono); color: #d2e7ff; background: rgba(8, 20, 40, 0.85); border: 1px solid var(--op); padding: 2px 5px; border-radius: 3px; transform: translate(10px, -50%); }
#finger { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); border: 2px solid #fff; transform: translate(-50%, -50%); }
#tablet .tf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 9px 12px; font: 11px var(--f-mono); color: var(--muted); border-top: 1px solid var(--line); background: #0b1117; }
#tablet .tf b { display: block; color: var(--fg); font-weight: 500; font-size: 13px; }

#bar { left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.btn { font: 500 12px/1 var(--f-mono); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 3px; height: 30px; min-width: 34px; padding: 0 9px; cursor: pointer; white-space: nowrap; }
#time { font: 400 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 86px; }
#chapters { flex: 1; display: flex; gap: 3px; min-width: 0; }
.chap { position: relative; height: 30px; background: rgba(150, 180, 200, 0.08); border: 0; border-radius: 2px; cursor: pointer; padding: 0 5px; overflow: hidden; text-align: left; color: var(--muted); font: 500 10px/30px var(--f-display); letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.chap .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(111, 211, 111, 0.22); border-right: 2px solid var(--coord); pointer-events: none; }
.chap.done .fill { border-right: 0; }
.chap span { position: relative; }
.chap.on { color: var(--fg); }
#bigPlay { position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 600 22px var(--f-display); color: var(--ink); background: var(--coord); border: 0; border-radius: 6px; padding: 14px 26px; cursor: pointer; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); font: 500 13px var(--f-mono); color: var(--muted); letter-spacing: 0.08em; z-index: 9; }

@media (max-height: 760px) { #caption { font-size: 13.5px; } #dash canvas { width: 190px; height: 232px; } .clip q { font-size: 13px; } }
@media (max-width: 980px) { #agent { width: 290px; } }
@media (max-width: 760px) {
  #agent { display: none; }
  #layers { top: auto; bottom: 70px; right: 16px; left: auto; max-width: 50%; }
  #dash canvas { width: 130px; height: 159px; }
  #dash .panel { padding: 6px 8px; } #dash h3 { font-size: 9px; letter-spacing: 0.06em; flex-direction: column; gap: 2px; }
  .tog { padding: 5px 7px; font-size: 10.5px; }
  .chap span { display: none; }
  #tablet { width: calc(100% - 32px); }
}
</style>

<div id="app">
  <div id="loading">Building nine rubble piles and their LiDAR scans…</div>
  <button id="bigPlay" hidden>▶ Play</button>
  <div class="hud" id="top">
    <div class="brand"><i></i>Larpverse · grid search</div>
    <div id="phaseNo">01 / 11</div>
    <div id="phaseTitle">Deploy</div>
    <div id="caption"></div>
  </div>
  <div class="hud" id="layers">
    <button class="tog" data-k="lidar" aria-pressed="true" style="--c: var(--lidar)"><i></i>LiDAR</button>
    <button class="tog" data-k="radar" aria-pressed="true" style="--c: var(--radar)"><i></i>Radar</button>
    <button class="tog" data-k="acoustic" aria-pressed="true" style="--c: var(--acoustic)"><i></i>Acoustic</button>
    <button class="tog" data-k="links" aria-pressed="true" style="--c: var(--coord)"><i></i>Data</button>
    <button class="tog" data-k="truth" aria-pressed="true" style="--c: #ffffff"><i></i>Ground truth</button>

  <div class="hud" id="dash">
    <div class="panel">
      <h3><span>Operator dashboard</span><span id="dashNote"></span></h3>

    </div>
  </div>
  <div class="hud" id="agent" hidden>
    <div class="panel">
      <h3><span>Acoustic agent · <span class="illus">illustrative</span></span><span id="agentState">receiving</span></h3>
      <div class="pipe"><span data-p="0">Silero VAD</span><span data-p="1">Whisper speech-to-text</span><span data-p="2">YAMNet sound class</span><span data-p="3">judge: Gemini or rule fallback</span><span data-p="4">priority</span></div>

      <div id="tabGL" hidden><div id="tabPing"></div><div id="tabYou">you</div></div>
      <div id="finger" hidden></div>

    <div class="tf" id="tabFacts"></div>
  </div>
  <div class="hud" id="bar">
    <button class="btn" id="play" aria-label="Pause">❚❚</button>
    <button class="btn" id="speed" aria-label="Playback speed">1×</button>
    <span id="time">0:00 / 1:28</span>
    <div id="chapters"></div>
  </div>
</div>

<script>
// Shows load/runtime failures on screen instead of a silent frozen page.
window.__fail = msg => {
  const load = document.getElementById('loading');
  if (load) { load.style.cssText += ';white-space:pre-wrap;text-align:center;padding:24px;color:#ffd0d0'; load.textContent = 'The animation could not start.\n' + msg + '\nTry reloading; if it persists, send this message to the team.'; return; }
  let bar = document.getElementById('errbar');
  if (!bar) { bar = document.body.appendChild(document.createElement('div')); bar.id = 'errbar'; bar.style.cssText = 'position:fixed;left:16px;right:16px;top:8px;z-index:20;font:12px monospace;color:#ffd0d0;background:rgba(60,8,8,.9);border:1px solid #ff4545;padding:6px 10px;border-radius:4px;white-space:pre-wrap'; }
  bar.textContent = 'Animation error (it keeps running): ' + msg;
};
addEventListener("error", e => { if (e instanceof ErrorEvent) { if (!/ResizeObserver/.test(e.message)) __fail(e.message); } else if (e.target && e.target.tagName === 'SCRIPT') __fail('Could not load a script: ' + (e.target.src || 'inline module (3D library from cdn.jsdelivr.net)')); }, true);
addEventListener('unhandledrejection', e => __fail(String(e.reason && e.reason.message || e.reason)));
setTimeout(() => { if (document.getElementById('loading')) __fail('Still loading after 20 s. The 3D library (cdn.jsdelivr.net) may be blocked or slow on this network.'); }, 20000);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ================= helpers =================
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const T_END = 88, LAYER_Y = 6.2, SP = 22;
const C = { lidar: 0x9b6bff, radar: 0xff9f43, acoustic: 0x22c3d6, cone: 0xffe14a, detect: 0xff4545, coord: 0x6fd36f, drone: 0xef5350, good: 0x4fd18b, bad: 0xff6464, op: 0x5aa9ff, grey: 0x7d8b96 };
const CHAPTERS = [
  ['Deploy', 0, 6], ['LiDAR map', 6, 14], ['Land on flat cells', 14, 19], ['Radar ping', 19, 25], ['Ping to dashboard', 25, 28],
  ['Audio to the agent', 28, 40], ['Priority & dispatch', 40, 44], ['Next pile', 44, 54], ['Operator on site', 54, 64], ['Dig', 64, 72], ['Whole system', 72, 88],
].map(([name, t0, t1]) => ({ name, t0, t1 }));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Default: the seeded scenario from animation/scenario_seed7.js (same map as Isaac + dashboard).
// Fallback: the old in-page random generator, when that file is missing or the URL has #s<number> (New scenario).
const HASH_SEED = (() => { const m = location.hash.match(/^#s(\d+)$/); return m ? +m[1] : null; })();
const SCN = HASH_SEED == null && window.LARP_SCENARIO && window.LARP_SCENARIO.piles ? window.LARP_SCENARIO : null;
const SEED = SCN ? SCN.seed : HASH_SEED ?? Math.floor(Math.random() * 1e6);
const rnd = mulberry32(SEED);
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sstep = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const d2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi; const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf); const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ================= the 3x3 grid of piles =================
const PILES = [];
if (SCN) for (const q of SCN.piles) PILES.push({ name: q.name, x: q.x, z: q.z, h: q.h, sx: q.sx, sz: q.sz, rot: q.rot, lx: q.lx, lz: q.lz, meshes: [], def: q });
else for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) PILES.push({
  name: 'ABC'[c] + (r + 1), x: (c - 1) * SP + R(-1.5, 1.5), z: (r - 1) * SP + R(-1.5, 1.5),
  h: R(2.6, 3.7), sx: R(5, 6.2), sz: R(4.4, 5.6), rot: R(0, Math.PI), lx: R(-2, 2), lz: R(-2, 2), meshes: [],
});
function mound(p, x, z) {
  const dx = x - p.x, dz = z - p.z; if (dx * dx + dz * dz > 170) return 0;
  const cs = Math.cos(p.rot), sn = Math.sin(p.rot), u = dx * cs + dz * sn, v = -dx * sn + dz * cs;
  return p.h * Math.exp(-((u / p.sx) ** 2 + (v / p.sz) ** 2) * 1.4) + 0.8 * Math.exp(-((dx - p.lx) ** 2 + (dz - p.lz) ** 2) / 4.5);
}
const NZ = SCN && SCN.noise;
function H(x, z) {
  let m = 0; for (const p of PILES) m += mound(p, x, z);
  const f = clamp(m / 0.9, 0, 1);
  if (NZ) { // exact port of sim/scenario.py Scenario.ground_height (site y = -z)
    const y = -z; let n = 0, r = 0;
    for (let i = 0; i < NZ.a.length; i++) { n += NZ.a[i] * Math.sin(NZ.kx[i] * x + NZ.ky[i] * y + NZ.ph[i]); r += 0.08 * Math.sin(NZ.kx[i] * 7 * x + NZ.ky[i] * 7 * y + NZ.ph[i] * 3); }
    return m + 0.03 * n + f * r;
  }
  return m + f * ((vnoise(x * 0.9, z * 0.9) - 0.5) * 0.5 + (vnoise(x * 3.1, z * 3.1) - 0.5) * 0.15) + (vnoise(x * 0.35, z * 0.35) - 0.5) * 0.05;
}

// ================= scenario: who is where (storyboard truth, display only) =================
const ROLE_DEFS = [
  { kind: 'voice', cls: 'voice · call for help', quote: 'Help! Can anyone hear me? My leg is trapped.', human: 0.97, urg: 0.95, base: 0.95, why: 'clear call for help, injury, conscious' },
  { kind: 'weak', cls: 'faint voice', quote: '…hello?… …water…', human: 0.85, urg: 0.9, base: 0.55, why: 'faint speech asking for water' },
  { kind: 'knock', cls: 'patterned knocking', quote: '[knock ×3, repeats every ~20 s]', human: 0.8, urg: 0.7, base: 0.92, why: 'rhythmic knocking, likely deliberate' },
  { kind: 'dog', cls: 'dog barking', quote: '[barking]', human: 0.04, urg: 0.3, base: 0.9, why: 'animal · dismissed as a lead, pile not cleared' },
  { kind: 'gen', cls: 'machinery', quote: '[50 Hz engine hum]', human: 0.01, urg: 0, base: 0.95, why: 'generator hum · dismissed, pile not cleared' },

  // dashboard minimap

  $('dashNote').innerHTML = flash ? '<b>new ping</b>' : t >= 61 ? '2 pings' : t >= 27.2 ? '1 ping' : '';
  // tablet
  tabletEl.hidden = !tabletOn(t);
  if (!tabletEl.hidden) {
    tabletEl.style.opacity = sstep(TAB0, TAB0 + 0.4, t) * (1 - sstep(TAB1 - 0.4, TAB1, t));
    const is3 = tab3D(t); tabGL.hidden = !is3; tabMap.hidden = is3; $('tabMode').textContent = is3 ? 'LiDAR model · pile ' + P1.name : 'map';
    if (!is3) {

      const P = drawMap(tctx, tabMap.width, tabMap.height, view, t, { you: true });
      const [px, py] = P(RAD1.est.x, RAD1.est.z), r = tabMap.getBoundingClientRect(), fx = px / tabMap.width * r.width, fy = py / tabMap.height * r.height;

      fingerEl.style.transform = `translate(-50%,-50%) scale(${t > TAP - 0.2 ? 0.75 : 1})`;
    } else fingerEl.hidden = true;
  }
  labelR.domElement.style.visibility = tabletOn(t) ? 'hidden' : '';
  if (follow) { camAt(t); camera.position.copy(_cp); controls.target.copy(_ct); }
}

    tabPing.textContent = `R1 · candidate depth ≈${RAD1.depth.toFixed(1)} m`; proj(V(RAD1.est.x, RAD1.estY, RAD1.est.z), tabPing); proj(youMk.position, tabYou);
