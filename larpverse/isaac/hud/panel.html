<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Larpverse · what the drones sense</title>
<!--
  Plain-language perception panel for the single take (layout B: Isaac stream left, this panel right).
  Rohan 2026-11-08: understandable with minimal robotics knowledge, never too fast, never overwhelming,
  numbers that look like (and are) real measurements.

  - One step at a time: a caption holds at least HOLD_S seconds; the measured rows refresh at most every ROWS_S.
  - Every number is read from the run's own files: state.json (mission), live.json (stage events, last radar scan
    with its breathing waveform), hud.json (LiDAR totals). Nothing here feeds back into the mission.
  - Width 640 (or 960) x 1080; everything scales with the window width.

    /isaac/hud/panel.html?state=../../dashboard/data/state.json      live.json / hud.json are read next to it
    &speed=N   show "sped up xN" when the files carry no pace           &bg=0  transparent background
-->
<style>
  :root { --lidar:#a98bff; --radar:#ff8a33; --sound:#2fc6d9; --ping:#ff5252;
          --ok:#4fd18b; --amber:#ffb020; --grey:#a7b0b8; --line:rgba(255,255,255,0.10); }
  html, body { margin:0; width:640px; height:1080px; overflow:hidden; background:#0c1014;
               font-family: Inter, "Segoe UI", system-ui, sans-serif; color:#eef2f5; }
  body.clear { background:transparent; }
  .wrap { box-sizing:border-box; height:1080px; padding:26px 28px; display:flex;
          flex-direction:column; gap:16px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
  .live { font-size:15px; letter-spacing:.16em; font-weight:700; color:#ff6b6b; }
  .clock { font-size:15px; color:var(--grey); text-align:right; line-height:1.4; }
  .clock b { color:#fff; font-size:19px; }
  .steps { display:flex; gap:5px; }
  .steps div { flex:1; text-align:center; font-size:11px; letter-spacing:.04em; color:#6f7a83;
               padding-top:7px; border-top:4px solid #2a3138; white-space:nowrap; }
  .steps div.done { color:#aab4bc; border-color:#5b6670; }
  .steps div.now { color:#fff; border-color:var(--amber); font-weight:700; }
  .card { background:rgba(255,255,255,0.045); border:1px solid var(--line); border-radius:14px;
          padding:18px 20px; }
  #cap.ev { border-color:var(--amber); background:rgba(255,176,32,0.09); }
  .t { font-size:33px; font-weight:700; line-height:1.12; }
  .c { font-size:20px; line-height:1.42; color:#d5dde3; margin-top:9px; }
  .h { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#8d98a1; margin-bottom:10px; }
  .chiprow { display:flex; gap:12px; align-items:center; }
  .chip { font-size:14px; font-weight:800; letter-spacing:.12em; padding:5px 11px;
          border-radius:7px; color:#0b0f13; white-space:nowrap; }
  .say { font-size:21px; line-height:1.32; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  td { font-size:17px; padding:5px 0; border-top:1px solid var(--line); vertical-align:top; }
  td.l { color:#9aa5ae; width:44%; padding-right:10px; }
  td.v { font-variant-numeric: tabular-nums; color:#fff; }
  .q { font-size:18px; font-style:italic; color:#e9f6f8; margin-top:10px; line-height:1.35; }
  .q small { display:block; font-style:normal; color:#8d98a1; font-size:13px; margin-top:3px; }
  canvas { width:100%; height:104px; display:block; margin-top:12px; }
  .wcap { font-size:13px; color:#8d98a1; margin-top:4px; }
  .lead { display:flex; gap:12px; align-items:flex-start; margin-top:6px; }
  .dot { width:13px; height:13px; border-radius:50%; background:var(--ping); margin-top:6px;
         box-shadow:0 0 0 4px rgba(255,82,82,0.22); flex:none; }
  .lead .a { font-size:19px; font-weight:700; }
  .lead .b { font-size:16px; color:#d5dde3; line-height:1.38; margin-top:2px; }
  .lead .n { font-size:13px; color:#8d98a1; margin-top:3px; }
  .foot { margin-top:auto; font-size:13px; color:#8d98a1; line-height:1.4; }
  .hide { display:none !important; }
  .fade { animation: fade .45s ease; } @keyframes fade { from { opacity:.35; transform:translateY(4px); } to { opacity:1; transform:none; } }   /* no near-empty frame on a caption change (reh4b 25 s) */
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="live">● LIVE SIMULATION</div><div class="clock"><b id="clk">0:00</b><br><span id="pace"></span></div></div>
  <div class="steps" id="steps"></div>
  <div class="card" id="cap"><div class="t" id="capt">Waiting for the mission…</div><div class="c" id="capc"></div></div>
  <div class="card" id="sense">
    <div class="h">What the drones sense right now</div>
    <div class="chiprow"><div class="chip" id="chip">—</div><div class="say" id="say"></div></div>
    <table id="rows"></table>
    <div id="wavebox" class="hide"><canvas id="wave" width="1200" height="270"></canvas><div class="wcap" id="wcap"></div></div>
    <div class="q hide" id="quote"></div>
  </div>
  <div class="card hide" id="leads"><div class="h">Places for rescuers to check first</div><div id="leadlist"></div></div>
  <div class="foot">Simulation. The trapped people, their voices and the radar returns are synthetic; the drones never
    see where they are. A lead is a place to check, not a confirmed person.</div>
</div>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get('bg') === '0') document.body.classList.add('clear');
const SRC = Q.get('state') || '../../dashboard/data/state.json';
const DIR = SRC.replace(/[^/]*$/, '');
const SPEED = +(Q.get('speed') || 0);
const HOLD_S = +(Q.get('hold') || 5), ROWS_S = +(Q.get('rows') || 1.5);
const $ = id => document.getElementById(id);
document.body.style.zoom = String(window.innerWidth / 640);     // 640 or 960 wide, same layout
const vnow = () => (window.__vt != null ? window.__vt : performance.now() / 1000);   // burn.js sets the video clock

const BEATS = ['Launch', 'Map', 'Radar', 'Listen', 'Live change', 'Re-plan', 'New area'];
$('steps').innerHTML = BEATS.map(b => `<div>${b}</div>`).join('');
const COL = { LIDAR: 'var(--lidar)', RADAR: 'var(--radar)', FOUND: 'var(--ping)', SOUND: 'var(--sound)', SPEAKER: 'var(--sound)', CHANGE: 'var(--amber)',
              DECISION: 'var(--ok)', FLYING: 'var(--grey)', FLEET: 'var(--grey)' };
const GLOSS = { voice: 'Help! Can anyone hear me?', weak_voice: 'Anyone there… water…', knock: '(knocking)', tapping: '(tapping)' };

let SAID = [];                                     // [{text, en, lang}] from assets/audio/dummies/manifest.json
fetch('../../assets/audio/dummies/manifest.json').then(r => r.json()).then(m => {
  const C = m.clips || m.items || Object.values(m).find(v => Array.isArray(v)) || [];
  SAID = C.filter(c => c.transcript).map(c => ({ text: c.transcript, en: c.transcript_en, lang: c.language }));
}).catch(() => {});
const LANG = { en: 'English', id: 'Indonesian', ms: 'Malay', vi: 'Vietnamese', tl: 'Tagalog', 'zh-TW': 'Mandarin', zh: 'Mandarin', nan: 'Taiwanese Hokkien', 'nan-TW': 'Taiwanese Hokkien' };
function heard(c) {                                 // what was said, in English, plus the original when it differs
  const tx = String(c.transcript || '').replace(/…$/, '').trim();
  if (!tx) return null;
  const hit = SAID.find(x => x.text && (x.text === tx || x.text.startsWith(tx)));
  let en = c.text_en || (hit && hit.en) || (/^[\x00-\x7F’']*$/.test(tx) ? c.transcript : GLOSS[c.class] || null);
  const lang = c.lang || c.language || (hit && hit.lang);
  let orig = en && tx !== en.replace(/…$/, '') ? c.transcript : '';
  // multilingual speech-to-text (live.json "heard"): the clip transcript is Whisper's English translation; the
  // words as spoken ride alongside. Show the meaning first, then the original language and words.
  const H0 = LIVE && LIVE.heard && LIVE.heard[c.pile_id];
  const H = H0 && H0.language && H0.language !== 'en' ? H0 : null;
  let small = '';
  if (H && H.english && String(H.english).trim() === tx) {          // translated: meaning first, then the words as spoken
    en = H.english; orig = H.original || '';
    small = `<small>spoken in ${esc(LANG[H.language] || H.language)}: “${esc(orig)}” · machine-translated</small>`;
  } else if (H && !H.english && String(H.original || '').trim() === tx) {   // heard in a language, no translation
    en = null;
    small = `<small>spoken in ${esc(LANG[H.language] || H.language)} (not translated)</small>`;
  } else {
    const nm = lang && lang !== 'en' ? esc(LANG[lang] || lang) : '';
    small = orig ? `<small>heard${nm ? ' in ' + nm : ''}: “${esc(orig)}”</small>` : '';
  }
  return (en ? `“${esc(en)}”` : `“${esc(c.transcript)}”`) + small;
}
let LIVE = null, HUD = null, firstEv = null, evSeenAt = null, evKey = null, opRev = null, opT = null, listenT0 = null;
const SEEN = new Set();                            // story steps that have really been on screen
let shown = { beat: -1, at: -1e9, title: '' }, rowsAt = -1e9, sayKey = '', waveKey = '', maxBeat = -1, sayAt = -1e9, forceSense = false;
const SAY_HOLD_S = 3;                              // the sensing line never flips faster than this (pods up/down at x24)

const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f0 = v => (v == null || isNaN(v)) ? '–' : Math.round(+v).toString();
const f1 = v => (v == null || isNaN(v)) ? '–' : (+v).toFixed(1);
const f2 = v => (v == null || isNaN(v)) ? '–' : (+v).toFixed(2);
const pct = v => (v == null || isNaN(v)) ? '–' : `${Math.round(100 * v)}%`;
const compass = b => { const c = ((90 - b) % 360 + 360) % 360;      // sim: deg counter-clockwise from east; map: y north
  return `${['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'][Math.round(c / 45) % 8]} (${c.toFixed(0)}°)`; };
const pings = s => (s.pings && s.pings.length ? s.pings : (s.radar_candidates || []).filter(c => c.status === 'candidate'));
// a scan counts as a breathing-like return only when the radar DSP reported one (range candidates or a breathing
// frequency); its vitals block alone is computed on whatever the strongest bin held (reh6: "30.8 breaths per minute"
// on scans the mission logged as "ranges no detection")
const scanHit = sc => !!(sc && ((sc.ranges && sc.ranges.length) || sc.breathing_hz));
const humanClips = s => (s.acoustic_clips || []).filter(c => ((c.scores || {}).human ?? c.human ?? 0) >= 0.4)
  .sort((a, b) => (b.priority ?? 0) - (a.priority ?? 0));

function event(s) {
  // the live, unscripted change: a stage event (hidden voice switched on, dummy moved) or a new operator zone
  const ev = LIVE && LIVE.last_event;
  // ignore a change stamped after the mission clock: a live.json left over from an earlier, longer run
  if (ev && ['activated', 'moved', 'added'].includes(ev.what) && +ev.t <= (+s.t || 0) + 5) return { kind: 'stage', t: +ev.t, ev };
  const rev = +((s.tasking || {}).revision || 0);
  if (opRev === null) opRev = rev;
  if (rev > opRev && opT === null) opT = +s.t;
  if (opT !== null) return { kind: 'zone', t: opT };
  return null;
}

// the pod-mic quick listen that heard the live change and asked for a re-plan (live.json replans; "next" is the
// pile the dispatch gate ranks first), before the fleet has left: the step between the change and the new plan
const replanAfter = ev => ev && ev.kind === 'stage' && LIVE && (LIVE.replans || []).filter(r => +r.t >= ev.t - 1e-6 && r.next).slice(-1)[0] || null;

function beatOf(s, ev) {
  const ph = String(s.phase || ''), m = s.mission || {}, t = +s.t || 0;
  const visited = m.visited || [], d = (s.dispatch || []).filter(x => x.to_pile);
  const after = ev ? d.filter(x => +x.t >= ev.t - 1e-6) : [];
  if (ev && evSeenAt !== null && vnow() - evSeenAt < 8 && !after.length) return 4;      // show the change itself
  if (replanAfter(ev) && !after.length) return 4;                                        // heard it: re-plan pending
  if (after.length) {
    if (['deploy', 'dispatch'].includes(ph) || (m.in_transit)) return 5;
    return 6;
  }
  const listening = m.stage === 'listen' || ph === 'acoustic' || ph.startsWith('recon_listen');
  if (listening && listenT0 === null) listenT0 = t;
  // a change made during the listen keeps "Live change" up until the re-plan; one made earlier (e.g. while the pods
  // were down) has had its own 8 s, so the listen then gets its own caption
  if (ev && !after.length && (listenT0 === null || ev.t >= listenT0 - 1e-6)
      && (listening || ['return', 'battery_swap'].includes(ph))) return 4;
  if (listening) return 3;
  if (['landing', 'radar', 'relocate', 'rescan'].includes(ph)) return visited.length > 1 && d.length ? 6 : 2;
  if (ph === 'survey' || ph.startsWith('recon_mapping')) return visited.length > 1 && d.length ? 6 : 1;
  if (['deploy', 'dispatch'].includes(ph)) return d.length ? 5 : 0;
  return Math.max(0, maxBeat);
}

function caption(b, s, ev) {
  const m = s.mission || {}, pile = m.active_pile || '';
  const d = (s.dispatch || []).filter(x => x.to_pile).slice(-1)[0];
  const here = pings(s).filter(p => !pile || p.pile_id === pile || String(p.id || '').startsWith(pile));
  if (b === 0) return ['Launch', 'Three rescue drones take off from the command van and fly to the collapsed building.'];
  if (b === 1) return ['Mapping the rubble', 'A laser scanner on each drone (LiDAR, the purple dots) builds a 3D map, so the drones know where they can safely put their sensors.'];
  if (b === 2 && here.length) return ['Breathing-like signal found', 'The radar picked up a steady breathing rhythm under the rubble. Rescuers get a place to check first. It is a lead, not a confirmed person.'];
  if (b === 2) return ['Feeling for breathing', 'Each drone lowers a radar pod onto the rubble on a cable. The radar can feel the tiny chest movement of breathing up to about 3 m down.'];
  if (b === 3) return ['Listening', 'The drones land and switch their rotors off. One calls out over its loudspeaker; then they all listen for voices and knocking from under the rubble.'];
  const rp = b === 4 ? replanAfter(ev) : null;
  if (rp && evSeenAt !== null && vnow() - evSeenAt >= 8) {
    const nx = esc(rp.next), here = esc(rp.from || pile || 'this pile');
    return ['New voice heard', rp.next === ev.ev.sector
      ? `The drones' microphones on the rubble just heard a voice near ${nx} that they had not heard before. They stop the search at ${here} early and fly to ${nx}.`
      : `The drones' microphones on the rubble just heard new sounds. ${nx} now ranks first, so they stop the search at ${here} early and fly there.`];
  }
  if (b === 4 && ev && ev.kind === 'stage')
    return ['Live change (unscripted)', `A teammate has just switched on a hidden voice near ${esc(ev.ev.sector || 'another pile')}. Nobody tells the drones. They have to hear it themselves.`];
  if (b === 4) return ['Live change (unscripted)', 'The operator has just added a new search area. Nobody tells the drones what to do next.'];
  if (b === 5) {
    const to = esc(d ? d.to_pile : 'a new area');
    // "Plan changed" only when the re-plan really follows the change: the new voice's pile, or an operator zone
    // live.json banner (LiveController._track_dispatch): what the fleet would have done without the live input
    const bm = /PLAN CHANGED: (\S+) → (\S+)/.exec((LIVE && LIVE.banner && LIVE.banner.text) || '');
    const was = bm && bm[2] === (d && d.to_pile) && /^[A-Z]\d$/.test(bm[1]) && bm[1] !== bm[2] ? esc(bm[1]) : null;
    const cut = was && d && bm[1] === d.from_pile;       // LiveController._replan: "PLAN CHANGED: <pile searched> → <to>"
    if (ev && ev.kind === 'stage' && d && d.to_pile === ev.ev.sector)
      return ['Plan changed', cut ? `The drones heard the new voice themselves. They cut the search at ${was} short and now fly to ${to}, where it came from.`
                            : was ? `Before the new voice, the drones planned to search ${was} next. They heard it themselves and now go to ${to} instead.`
                                  : `The drones heard the new voice and decided by themselves to search ${to} next, because that is where it came from.`];
    if (ev && ev.kind === 'zone') return ['Plan changed', `The drones decided by themselves to search ${to} next.`];
    const why = /voice|acoustic|heard|priority/i.test((d || {}).reason || '') ? ', because the strongest voice came from there' : '';
    return ['The swarm decides', `The drones decided by themselves to search ${to} next${why}.`];
  }
  if (b === 6 && here.length) return ['Breathing-like signal found', `At ${esc(pile)} the radar picked up a breathing rhythm. Another place for rescuers to check. A lead, not a confirmed person.`];
  return ['Searching the new area', `The same steps at ${esc(pile || 'the new area')}: map it, then lower the radar pods to feel for breathing.`];
}

function sense(b, s, ev) {
  // [chip, plain sentence, [[label, value], ...], quote | null]
  const m = s.mission || {}, ph = String(s.phase || ''), t = +s.t || 0, pile = m.active_pile || '';
  const drones = s.drones || [];
  const rp = b === 4 ? replanAfter(ev) : null;
  if (rp && evSeenAt !== null && vnow() - evSeenAt >= 8) {
    const c = humanClips(s).filter(c => c.pile_id === rp.next)[0];
    const rows = [['Heard by', 'microphones resting on the rubble (rotors off)']];
    if (c) rows.push(['Voice priority', `${c.priority} / 100`], ['Drones agreeing on direction', String(c.doa_agree || '–')]);
    rows.push(['Next', `finish the scan under way, then fly to ${esc(rp.next)}`]);
    return ['SOUND', `New voice heard${rp.next === ev.ev.sector ? ' near ' + esc(rp.next) : ''}`, rows, c ? heard(c) : null];
  }
  if (b === 4 && ev && ev.kind === 'stage') {
    const e = ev.ev;
    return ['CHANGE', `Hidden voice switched on near ${esc(e.sector)}`, [['When', `mission time ${f0(e.t)} s`],
            ['Who did it', 'a teammate, live (not scheduled)'], ['Drones told?', 'no: only their microphones can notice']], null];
  }
  if (b === 4) return ['CHANGE', 'New search area added by the operator', [['Tasking revision', f0((s.tasking || {}).revision)],
            ['When', `mission time ${f0(ev ? ev.t : t)} s`], ['Drones told what to do?', 'no: they decide']], null];
  if (b === 5) {
    const d = (s.dispatch || []).filter(x => x.to_pile).slice(-1)[0] || {};
    const c = humanClips(s).filter(c => c.pile_id === d.to_pile)[0];
    const rows = [['Next area', d.to_pile || '–'], ['Decided at', `mission time ${f0(d.t)} s`]];
    if (c) rows.push(['Voice priority', `${c.priority} / 100`], ['Drones agreeing on direction', String(c.doa_agree || '–')],
                      ['Loudness above noise', c.snr_db != null ? `${f1(c.snr_db)} dB` : '–']);
    // the runner-up from the logged dispatch gate: what the drones weighed it against (state.decisions)
    const g = (s.decisions || []).filter(x => x.gate === 'dispatch' && Math.abs((+x.t || 0) - (+d.t || 0)) < 1.5).slice(-1)[0];
    const alt = g && (g.options || []).filter(o => o.action === 'dispatch' && o.pile_id && o.pile_id !== d.to_pile && o.priority != null)
                                      .sort((x, y) => y.priority - x.priority)[0];
    if (alt) rows.push(['Next best option', `${alt.pile_id} (priority ${alt.priority})`]);
    return ['DECISION', `Flying to ${esc(d.to_pile || 'the new area')}`, rows, c ? heard(c) : null];
  }
  // while the Listening caption is still held, keep showing what was heard (the reason for the flight that follows)
  if (b !== 3 && (ph === 'deploy' || ph === 'dispatch' || ph === 'return' || ph === 'battery_swap')) {
    const bat = drones.map(q => `${Math.round(100 * (q.battery ?? 0))}%`).join(' · ');
    const alt = drones.length ? drones.reduce((a, q) => a + q.pose[2], 0) / drones.length : null;
    const say = (ph === 'return' || ph === 'battery_swap') ? 'Flying back to swap batteries' : `Flying to ${esc(pile || 'the search area')}`;
    return ['FLYING', say, [['Drones', String(drones.length)], ['Battery', bat || '–'], ['Height', alt ? `${f0(alt)} m` : '–']], null];
  }
  if (ph === 'survey' || ph.startsWith('recon_mapping')) {
    const L = (HUD && HUD.panels && HUD.panels.lidar) || {};
    const z = (s.zones || []).find(z => ['surveying', 'scanning', 'in_progress'].includes(z.status));
    const cov = L.coverage != null ? L.coverage : (z && z.coverage ? z.coverage.lidar_mapped : null);
    const alt = drones.length ? drones.reduce((a, q) => a + q.pose[2], 0) / drones.length : null;
    const rows = [['Area mapped', pct(cov)]];
    if (L.total) rows.push(['Laser points measured', L.total > 1e6 ? `${(L.total / 1e6).toFixed(2)} million` : `${Math.round(L.total / 1000)} thousand`]);
    rows.push(['Flying height', alt ? `${f0(alt)} m` : '–']);
    return ['LIDAR', `Mapping ${esc(pile)} in 3D with laser scanners`, rows, null];
  }
  if (['landing', 'radar', 'relocate', 'rescan'].includes(ph)) {
    const sc = LIVE && LIVE.last_scan && (!pile || LIVE.last_scan.pile === pile) ? LIVE.last_scan : null;
    const st = (s.scans || []).filter(x => !pile || x.pile_id === pile).slice(-1)[0];
    const pods = (s.pods || []).filter(p => ['scanning', 'resting', 'lowering'].includes(p.status));
    const down = pods.filter(p => p.status !== 'lowering').length;
    const here = pings(s).filter(p => !pile || p.pile_id === pile || String(p.id || '').startsWith(pile));
    if (here.length) {
      const p = here[here.length - 1], v = p.vitals || {};
      return ['FOUND', 'Breathing-like rhythm under the rubble', [
        ['Breathing rate', v.rate_bpm != null ? `${f1(v.rate_bpm)} per minute (range ${f1(v.rate_ci ? v.rate_ci[0] : v.rate_bpm)}–${f1(v.rate_ci ? v.rate_ci[1] : v.rate_bpm)})`
                           : (p.breathing_hz ? `about ${f0(60 * p.breathing_hz)} per minute (first estimate)` : '–')],
        ['Pattern', v.pattern ? String(v.pattern).replace(/_/g, ' ') : 'measuring (60 s scan)…'],
        ['Scans that agree', p.support != null ? String(p.support) : '–']], null];
    }
    if (sc && sc.vitals && !scanHit(sc))     // the DSP found no return above its threshold: never a "rhythm" (reh6)
      return ['RADAR', `Pod ${esc(sc.drone_id)}: nothing strong enough to count in this scan`, [
        ['Last scan', `${esc(sc.scan_id)} · quality ${f2(sc.quality)}`],
        ['Result', 'no breathing return above the detection threshold'],
        ['Reach', 'about 3 m down']], null];
    if (sc && sc.vitals) {
      const v = sc.vitals;
      const npk = sc.wave && v.duration_s ? breathPeaks(sc.wave, v.duration_s / (sc.wave.length - 1), v.rate_bpm).length : null;
      return ['RADAR', v.rate_bpm ? `Pod ${esc(sc.drone_id)} feels a rhythm: ${f1(v.rate_bpm)} breaths per minute` : `Pod ${esc(sc.drone_id)}: no breathing rhythm in this scan`, [
        ['Breaths counted', npk ? `${npk} in ${f0(v.duration_s)} s (white dots)` : (v.n_breaths != null ? `${v.n_breaths} in ${f0(v.duration_s)} s` : '–')],
        ['Breathing rate', v.rate_bpm != null ? `${f1(v.rate_bpm)} per minute` + (v.rate_ci ? ` (likely ${f1(v.rate_ci[0])}–${f1(v.rate_ci[1])})` : '') : '–'],
        ['Signal above noise', v.snr_db != null ? `${f1(v.snr_db)} dB` : '–'],
        ['Distance from the pod', sc.ranges && sc.ranges.length ? `${f1(sc.ranges[0])} m` : '–']], null];
    }
    if (pods.length) return ['RADAR', down ? `${down} radar pod${down > 1 ? 's' : ''} resting on the rubble, feeling for breathing` : 'Lowering radar pods on their cables', [
        ['Pods on the rubble', `${down} of ${pods.length}`],
        ['Cable out', drones.filter(d => pods.some(p => p.drone_id === d.id)).map(d => `${f1(d.winch_len_m)} m`).join(' · ') || '–'],
        ['Last scan', st ? `${esc(st.scan_id)} · quality ${f2(st.quality)}` : 'none yet']], null];
    return ['RADAR', 'Moving the drones over the rubble to drop the radar pods', [['Drones', String(drones.length)],
        ['Radar reach', st && st.max_reliable_depth_m ? `about ${f1(st.max_reliable_depth_m)} m down` : 'about 3 m down']], null];
  }
  if (b === 3 || m.stage === 'listen' || ph === 'acoustic' || ph.startsWith('recon_listen')) {
    const c = humanClips(s).filter(c => !LIVE || !LIVE.last_listen || true)[0];
    const n = drones.filter(d => d.state === 'listening').length;
    if (c) {
      const sc = c.scores || {};
      return ['SOUND', `Human voice heard near ${esc(c.pile_id || '?')}`, [
        ['How sure it is a person', f2(sc.human ?? c.human)],
        ['Direction', c.bearing_deg != null ? `${compass(c.bearing_deg)} ± ${f0(c.width_deg / 2)}° from ${esc(c.drone_id)}` : '–'],
        ['Loudness above noise', c.snr_db != null ? `${f1(c.snr_db)} dB` : '–'],
        ['Drones that agree', String(c.doa_agree || '–')]],
        heard(c)];
    }
    // no result yet: say what is happening now from the run's own call-out record (state.callouts / broadcasts)
    const since = listenT0 != null ? listenT0 - 1 : t - 200;
    const bc = (s.broadcasts || []).filter(x => +x.t >= since && +x.t <= t + 0.5).slice(-1)[0];
    const co = (s.callouts || []).filter(x => +x.t_start - 30 <= t && t <= +x.t_end + 1).slice(-1)[0];
    const step = co && (co.steps || []).find(x => +x.t0 <= t && t < +x.t1);
    if (step && step.step === 'listen')
      return ['SOUND', 'Silence again: listening for an answer to the call-out', [['Drones listening', `${n} of ${drones.length}`],
          ['Listening for', 'knocking or a voice'], ['Time left', `${f0(+step.t1 - t)} s (mission time)`]], null];
    if (bc && t - +bc.t < 30) {
      const lang = LANG[bc.lang] || bc.lang, who = esc(bc.drone_id || 'a drone');
      const quote = `“${esc(bc.text_en || bc.text)}”` + (bc.lang !== 'en' && bc.text ? `<small>said in ${esc(lang)}: “${esc(bc.text)}”</small>` : '');
      if (bc.kind === 'callout')
        return ['SPEAKER', `Loudspeaker call-out from drone ${who}`, [['Languages', 'Mandarin, Taiwanese Hokkien, English'],
            ['Now', lang], ['Then', 'all drones listen in silence for knocks or a voice']], quote];
      if (bc.kind === 'reassure')
        return ['SPEAKER', 'Reassurance for anyone who answered', [['Now', lang], ['Why', 'an answer came from this direction']], quote];
      if (bc.kind === 'guidance')
        return ['SPEAKER', 'Directions for someone who can walk out', [['Now', lang], ['Route', 'kept clear of the rubble']], quote];
    }
    const left = m.listen_ends != null ? Math.max(0, Math.round(m.listen_ends - t)) : null;
    return ['SOUND', 'Rotors off. Listening in silence for voices and knocking…', [['Drones listening', `${n} of ${drones.length}`],
        ['Quiet time left', left != null && left > 0 ? `${left} s (mission time)` : 'analysing what was heard…']], null];
  }
  return ['FLEET', 'Standing by', [['Drones', String(drones.length)]], null];
}

// Breath markers on the radar trace: local maxima of the band-passed chest signal above 35 % of the trace's own peak
// level, at least half a breath period apart (period from the DSP's rate; 1.6 s if no rate yet). Checked on scan s7:
// 9 peaks in 60 s, i.e. 8 breath-to-breath intervals = sim/vitals.py's n_breaths 8 and 8.8/min.
function breathPeaks(w, secPerSample, rateBpm) {
  const minGap = rateBpm ? 0.5 * 60 / rateBpm : 1.6;
  const gap = Math.max(1, Math.round(minGap / secPerSample)), pk = [];
  const hi = Math.max(...w.map(Math.abs)) || 1;
  for (let i = 1; i < w.length - 1; i++) {
    if (w[i] < 0.35 * hi || w[i] < w[i - 1] || w[i] < w[i + 1]) continue;
    if (pk.length && i - pk[pk.length - 1] < gap) { if (w[i] > w[pk[pk.length - 1]]) pk[pk.length - 1] = i; continue; }
    pk.push(i);
  }
  return pk;
}

function drawWave(sc) {
  const box = $('wavebox');
  // no trace for a scan without a detection: a grey wiggle next to "nothing to count" confused (reh6 75 s)
  if (!sc || !sc.wave || !sc.wave.length || !scanHit(sc)) { box.classList.add('hide'); waveKey = ''; return; }
  box.classList.remove('hide');
  const key = sc.scan_id + ':' + sc.t;
  const cv = $('wave'), g = cv.getContext('2d'), W = cv.width, H = cv.height, w = sc.wave;
  const born = key === waveKey ? drawWave.born : vnow();
  if (key !== waveKey) { waveKey = key; drawWave.born = born; }
  const frac = Math.min(1, (vnow() - born) / 1.6);                 // draw the trace on over 1.6 s, not instantly
  const v = sc.vitals || {};
  // a scan with no breathing-like return (no rate, no range): its trace is noise, so say so and draw it grey, no dots
  const none = !scanHit(sc);
  const dur = +v.duration_s || null;                               // scan window (s); unknown before vitals exist
  const L = 64, R = 14, T = 24, B = 44, pw = W - L - R, ph = H - T - B;
  const amp = Math.max(...w.map(Math.abs)) || 1;                   // symmetric scale: 0 = chest at rest position
  const X = i => L + i / (w.length - 1) * pw, Y = val => T + ph / 2 - val / amp * (ph / 2 - 6);
  g.clearRect(0, 0, W, H);
  g.font = '22px Inter, system-ui, sans-serif'; g.fillStyle = '#8d98a1'; g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(L, T + ph / 2); g.lineTo(L + pw, T + ph / 2); g.stroke();          // rest line
  g.beginPath(); g.moveTo(L, T); g.lineTo(L, T + ph); g.lineTo(L + pw, T + ph); g.stroke(); // axes
  g.save(); g.translate(22, T + ph / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center';
  g.fillText(none ? 'signal' : 'chest', 0, 0); g.restore();
  if (dur) {                                                       // time axis in seconds of the radar scan
    g.textAlign = 'center';
    const step = dur > 40 ? 10 : 5;
    for (let s0 = 0; s0 <= dur + 1e-6; s0 += step) {
      const x = L + s0 / dur * pw;
      g.beginPath(); g.moveTo(x, T + ph); g.lineTo(x, T + ph + 8); g.stroke();
      g.fillText(s0 === dur ? `${s0} s` : `${s0}`, Math.min(x, W - R - 22), T + ph + 32);
    }
  }
  g.strokeStyle = none ? '#6b7680' : '#ff8a33'; g.lineWidth = 5; g.lineJoin = 'round'; g.beginPath();
  const n = Math.max(2, Math.floor(w.length * frac));
  for (let i = 0; i < n; i++) { const x = X(i), y = Y(w[i]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  const pk = dur && !none ? breathPeaks(w, dur / (w.length - 1), v.rate_bpm || (sc.breathing_hz ? 60 * sc.breathing_hz : null)) : [];
  g.fillStyle = '#ffffff';
  pk.filter(i => i < n).forEach(i => { g.beginPath(); g.arc(X(i), Y(w[i]) - 14, 6, 0, 2 * Math.PI); g.fill(); });
  const parts = none ? [`Radar pod ${sc.drone_id} at ${sc.pile}: no breathing return above the detection threshold in this scan`]
    : [`Measured by radar pod ${sc.drone_id} at ${sc.pile}: chest movement (relative scale)` + (dur ? ` over ${f0(dur)} s` : '')];
  if (pk.length) parts.push('white dots = breaths');
  else if (sc.breathing_hz && !v.rate_bpm) parts.push(`about ${f0(60 * sc.breathing_hz)}/min (first estimate)`);
  if (v.apnea_events) parts.push(`${v.apnea_events} pause${v.apnea_events > 1 ? 's' : ''} in breathing`);
  $('wcap').textContent = parts.join(' · ');
}

function leads(s) {
  const P = pings(s).filter(p => p.vitals || p.breathing_hz);
  $('leads').classList.toggle('hide', !P.length);
  $('leadlist').innerHTML = P.slice(-2).map(p => {
    const v = p.vitals || {}, rate = v.rate_bpm != null ? `${f0(v.rate_bpm)}/min` : (p.breathing_hz ? `about ${f0(60 * p.breathing_hz)}/min (first estimate)` : '');
    const txt = v.condition_text ? v.condition_text.replace(/\s*->\s*/, ': ') : (v.pattern ? String(v.pattern).replace(/_/g, ' ') + ' breathing' : 'breathing-like rhythm');
    return `<div class="lead"><div class="dot"></div><div><div class="a">${esc(p.id)}${rate ? ' · ' + rate : ''}${v.triage_hint ? ' · ' + esc(v.triage_hint) : ''}</div>` +
           `<div class="b">${esc(txt.charAt(0).toUpperCase() + txt.slice(1))}</div><div class="n">Aid for rescuers, not a diagnosis.</div></div></div>`;
  }).join('');
}

function render(s) {
  const now = vnow(), t = +s.t || 0;
  const ev = event(s);
  const evK = ev ? ev.kind + ':' + ev.t : null;      // a new change gets its own 8 s (reh5b: a stale one at 0 s ate it)
  if (ev && evK !== evKey) { evKey = evK; evSeenAt = now; }
  let b = beatOf(s, ev);
  const [title, text] = caption(b, s, ev);
  // never faster than HOLD_S: a new caption waits until the current one has been on screen long enough
  if (title !== shown.title && now - shown.at >= HOLD_S) {
    $('capt').textContent = title; $('capc').innerHTML = text;
    const el = $('cap'); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
    el.classList.toggle('ev', b === 4);
    shown = { beat: b, at: now, title };
    rowsAt = -1e9; forceSense = true;               // the rows follow the caption at once
  }
  b = shown.beat >= 0 ? shown.beat : b;
  maxBeat = Math.max(maxBeat, b); SEEN.add(b);
  [...$('steps').children].forEach((el, i) => { el.className = i === b ? 'now' : (SEEN.has(i) || i < Math.min(b, 3) ? 'done' : ''); });
  if (now - rowsAt >= ROWS_S) {
    rowsAt = now;
    const [chip, say, rows, quote] = sense(b, s, ev);
    const k = chip + say;
    if (k !== sayKey && !forceSense && now - sayAt < SAY_HOLD_S) { leads(s); }    // hold the current line a little longer
    else {
    if (k !== sayKey) sayAt = now;
    forceSense = false;
    $('chip').textContent = chip === 'FOUND' ? 'RADAR' : chip; $('chip').style.background = COL[chip] || 'var(--grey)';
    if (k !== sayKey) { $('say').innerHTML = say; const el = $('sense'); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); sayKey = k; }
    $('rows').innerHTML = rows.map(([l, v]) => `<tr><td class="l">${l}</td><td class="v">${v}</td></tr>`).join('');
    $('quote').classList.toggle('hide', !quote); $('quote').innerHTML = quote || '';
    leads(s);
    }
  }
  const pile = (s.mission || {}).active_pile;
  const radarNow = ['landing', 'radar', 'relocate', 'rescan'].includes(String(s.phase)) && b !== 4 && b !== 5;
  drawWave(radarNow && LIVE && LIVE.last_scan && (!pile || LIVE.last_scan.pile === pile) ? LIVE.last_scan : null);
  const mm = Math.floor(t / 60), ss = Math.floor(t % 60);
  $('clk').textContent = `mission time ${mm}:${String(ss).padStart(2, '0')}`;
  const hdr = HUD && HUD.panels && HUD.panels.header && HUD.panels.header.text || '';
  const lap = (hdr.match(/x([\d.]+)/) || [])[1] || (SPEED ? SPEED : '');
  $('pace').textContent = lap && +lap > 1.01 ? `sped up ×${(+lap).toFixed(0)} (time-lapse)` : 'real time';
  window._last = s;
}

async function getJSON(u) {
  const r = await fetch(u + (u.includes('?') ? '&' : '?') + 'ts=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function poll() {
  try { render(await getJSON(SRC)); } catch (e) { /* keep the last frame */ }
}
async function pollSide() {
  try { LIVE = await getJSON(DIR + 'live.json'); } catch (e) { }
  try { HUD = await getJSON(DIR + 'hud.json'); } catch (e) { }
}
if (!window.__burn) { setInterval(poll, 250); setInterval(pollSide, 500); pollSide().then(poll); }
</script>
